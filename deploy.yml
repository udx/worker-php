# npm install -g @udx/worker-deployment
# gcloud auth login
# gcloud auth application-default login
# worker run

---
kind: workerDeployConfig
version: udx.io/worker-v1/deploy
config:
  # Docker image
  image: "usabilitydynamics/udx-worker-php:latest"

  # Mount volumes
  volumes:
    - "./src/scripts:/var/www"

  ports:
    - "80:80"
