kind: repo
version: udx.dev/rabbit.ci/repo/v1
repository:
  name: worker-php
  owner: udx
  default_branch: latest
branches:
  - name: chore/rabbit-ci-worker-0.52.0
    rules: {}
  - name: latest
    rules:
      allow_deletions: false
      allow_force_pushes: false
      pull_request:
        approvals: 1
        code_owner_review: true
        stale_reviews: true
        last_push_approval: false
        conversation_resolution: true
        merge_methods:
          - merge
          - squash
          - rebase
      copilot_review:
        on_push: true
        drafts: false
configuration:
  secrets:
    organization:
      - BITBUCKET_TOKEN
      - CONTEXT7_API_KEY
      - DEPENDABOT_REVIEWER_TOKEN
    repository:
      - DOCKER_TOKEN
      - GH_TOKEN
  variables:
    organization:
      - DOCKER_LOGIN
      - DOCKER_ORG
      - GCP_PROJECT_ID
      - GCP_REGION
      - GCP_WORKLOAD_IDENTITY_PROVIDER
      - GH_SERVICE_ACCOUNT_EMAIL
    repository:
      - DOCKER_REPO
environments:
  - name: copilot
    branches:
      - "*"
    approvals: []
    wait_minutes: 0
    admin_bypass: true
    secrets: []
    variables: []
workflows:
  - path: .github/workflows/codeql-analysis.yml
    triggers:
      push: {}
    permissions:
      contents: read
  - path: .github/workflows/docker-dependency-updater.yml
    triggers:
      schedule:
        - cron: 0 5 * * 1
      workflow_dispatch: {}
    permissions:
      contents: read
  - path: .github/workflows/docker-ops.yml
    triggers:
      push:
        paths:
          - .github/workflows/docker-ops.yml
          - bin/**
          - Dockerfile
          - etc/**
          - ci/**
          - src/**
          - LICENSE
      workflow_dispatch: {}
  - path: .github/workflows/tests.yml
    triggers:
      push: {}
      pull_request: {}
    permissions:
      contents: read
